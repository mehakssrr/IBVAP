camera:
  rtsp_url: "rtsp://admin:password@192.168.1.100:554/stream1"
  fps_target: 25

detection:
  model: "yolov8n.pt"  # nano for speed
  confidence_threshold: 0.5

tracking:
  max_age: 30
  min_hits: 3

virtual_fence:
  enabled: true
  polygon: [[100,200], [300,200], [300,400], [100,400]]

alerts:
  webhook_url: "http://localhost:8000/alert"
  log_to_db: true
